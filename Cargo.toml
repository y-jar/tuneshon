[package]
name = "tuneshon"
version = "0.1.0"
edition = "2021"
description = "A lightweight, fast NixOS update tool with GUI and CLI."
license = "MIT"

[[bin]]
name = "tuneshon"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.29", default-features = false, features = [
    "default_fonts",
] }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = [
    "full",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
anyhow = "1.0"
dirs = "6"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["gui"]
gui = []